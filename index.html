<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Computing - SP23-BSE-032</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #edf2f7;
            color: #203047;
            margin: 0;
            padding: 40px 20px;
        }
        main {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px #20304715;
        }
        h1 { color: #174e65; }
        .subtitle { color: #64748b; }
        section {
            border-top: 1px solid #dbe3ea;
            margin-top: 25px;
            padding-top: 20px;
        }
        button {
            background: #176b78;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bccbd5;
            border-radius: 6px;
            margin: 10px 0;
        }
        .result {
            color: #176b78;
            font-weight: bold;
        }
    </style>
</head>
<body>
<main>
    <p class="subtitle">CSC418 | Lab Assignment 3</p>
    <h1 id="heading">Incorrect Deployment Portal</h1>
    <p>Student: M Dawood Iqbal</p>
    <p id="roll">Roll Number: SP23-BSE-032</p>

    <section>
        <h2>Welcome</h2>
        <button id="greet" onclick="showMessage()">Show Message</button>
        <p id="message" class="result"></p>
    </section>

    <section>
        <h2>Enter Your Message</h2>
        <label for="userInput">Your text</label>
        <input id="userInput" placeholder="Write something here">
        <button id="submit" onclick="submitText()">Submit</button>
        <p id="output" class="result"></p>
    </section>
</main>

<script>
    function showMessage() {
        document.getElementById('message').textContent =
            'Welcome to my cloud application!';
    }

    function submitText() {
        const value = document.getElementById('userInput').value;
        document.getElementById('output').textContent = value;
    }
</script>
</body>
</html>
